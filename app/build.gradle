import java.util.regex.Pattern

plugins {
    alias(libs.plugins.android.application)
    alias(libs.plugins.kotlin.android)
    alias(libs.plugins.navigation.safeargs)
    alias(libs.plugins.ksp)
    alias(libs.plugins.hilt.android)
}

android {
    namespace "org.d1scw0rld.bookbag"
    compileSdkVersion 37

    defaultConfig {
        applicationId "org.d1scw0rld.bookbag"
        minSdkVersion 24
        targetSdkVersion 37
    }

    signingConfigs {
        release {
            def storeFilePath = System.getenv("BOOKBAG_STORE_FILE")
            if (storeFilePath) {
                storeFile file(storeFilePath)
                storePassword System.getenv("BOOKBAG_STORE_PASSWORD")
                keyAlias System.getenv("BOOKBAG_KEY_ALIAS")
                keyPassword System.getenv("BOOKBAG_KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            def storeFilePath = System.getenv("BOOKBAG_STORE_FILE")
            if (storeFilePath) {
                signingConfig signingConfigs.release
            } else if (gradle.startParameter.taskNames.any {
                def taskName = it.tokenize(':').last().toLowerCase()
                taskName == "assemblerelease" || taskName == "bundlerelease"
            }) {
                throw new GradleException("Release builds require BOOKBAG_STORE_FILE and related signing environment variables.")
            }
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.txt'
            applicationVariants.all { variant ->
                variant.outputs.all {
                    println("new filename" + outputFileName )
                    def projectName = 'BookBag'
                    def newName = outputFileName
                    newName = newName.replace("app-", projectName + '-')
                    def manifestFile = file("src/main/AndroidManifest.xml")
                    def patternVersionNumber = Pattern.compile("versionName=\"(\\d+)\\.(\\d+)\\.(\\d+)\"")
                    def manifestText = manifestFile.getText()
                    def matcherVersionNumber = patternVersionNumber.matcher(manifestText)
                    matcherVersionNumber.find()

                    newName = newName.replace("-release", '-' + matcherVersionNumber.group(1) + '.' + matcherVersionNumber.group(2) + '.' + matcherVersionNumber.group(3))
                    outputFileName = newName
                }
            }
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    buildFeatures {
        viewBinding true
    }
    testOptions {
        unitTests {
            includeAndroidResources = true
            all {
                useJUnitPlatform()
            }
        }
    }
    namespace 'org.d1scw0rld.bookbag'
}

dependencies {
    implementation libs.androidx.legacy.support.v4
    implementation libs.androidx.espresso.contrib
    implementation libs.material
    implementation libs.androidx.preference
    // Keep this lower version, because of ugly preferences screen look
    implementation libs.materialdatetimepicker

